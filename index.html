<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunu Champions — Candidatures 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body class="bg-page font-sora text-white">
  <main class="relative min-h-screen w-full overflow-hidden bg-page">
    <section class="relative flex h-screen max-h-[1180px] min-h-[700px] flex-col justify-between overflow-hidden bg-white/60 px-6 py-[30px] min-[1920px]:px-[130px] lg:px-[6.77vw]">
      <img class="pointer-events-none absolute bottom-0 left-0 h-[110%] w-[102%] max-w-none object-cover" src="assets/designer.png" alt="">
      <div class="pointer-events-none absolute inset-y-0 left-0 w-full max-w-[1109px] bg-linear-to-r from-black/80 from-25% to-transparent backdrop-blur-[50px]"></div>
      <div class="pointer-events-none absolute inset-x-0 top-0 h-[254px] bg-linear-to-b from-black/70 from-[7.6%] to-transparent to-[93.5%] backdrop-blur-[50px]"></div>

      <img class="pointer-events-none absolute -left-[517px] -top-[44px] z-[1] h-[1238px] w-[1056px] max-w-none" src="assets/watermark.svg" alt="">

      <header class="relative z-[2] flex w-full items-center justify-between">
        <div class="relative h-10 w-[174px]" role="img" aria-label="République du Sénégal">
          <img class="absolute left-0 top-0 h-[10.82px] w-[18.132px] max-w-none" src="assets/flag.png" alt="">
          <img class="absolute left-[89.58px] top-[14px] h-[13.232px] w-[84.213px] max-w-none" src="assets/logo-1.svg" alt="">
          <img class="absolute left-0 top-[14.43px] h-[15.268px] w-[83.477px] max-w-none" src="assets/logo-2.svg" alt="">
          <img class="absolute left-0 top-[33px] h-[7.03px] w-[73.332px] max-w-none" src="assets/logo-3.svg" alt="">
        </div>
        <span class="inline-flex h-[30.1px] items-center whitespace-nowrap rounded-full border-[0.8px] border-[rgba(18,183,106,0.25)] bg-[rgba(18,183,106,0.28)] px-3 py-1.5 text-[11px] uppercase leading-[16.5px] tracking-[1.98px] text-[#0f8]">Agenda 2050</span>
      </header>

      <div class="relative z-[2] flex max-w-[718px] flex-1 flex-col items-start justify-center gap-[30px]">
        <div class="flex items-center gap-3">
          <img class="mx-[3.5px] h-11 w-[37px]" src="assets/icone-blanc.svg" alt="">
          <div class="flex flex-col justify-between self-stretch">
            <p class="whitespace-nowrap text-[24px] font-bold leading-6 tracking-[-0.4px]">Sunu Champions</p>
            <p class="text-xs leading-3">Candidatures 2026</p>
          </div>
        </div>

        <img class="block h-auto w-[490px] max-w-full" src="assets/line.svg" alt="">

        <h1 class="w-[718px] max-w-full text-[clamp(36px,2.87vw,55px)] font-semibold leading-[normal] tracking-[-0.95px]">Le dispositif<br>souverain de sélection des champions économiques nationaux.</h1>

        <button type="button" class="inline-flex h-[50px] w-[310px] max-w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-champion-green py-3 text-base font-semibold leading-5 text-[#eef2f9] transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-[#0f8]">
          <span>Continuer</span>
          <img src="assets/arrow.svg" alt="" width="16" height="16">
        </button>
      </div>
    </section>
  </main>
</body>
</html>
